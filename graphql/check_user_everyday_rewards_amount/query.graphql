query FarcasterUserClaimTransactionDetails($fid: Int!) {
  FarcasterUserClaimTransactionDetails(input: { fid: $fid }) {
    fid
    availableClaimAmount
    minimumClaimableAmountInWei
    availableClaimAmountInWei
    claimedAmount
    claimedAmountInWei
    processingAmount
    processingAmountInWei
  }
}
