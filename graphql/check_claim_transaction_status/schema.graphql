type Query {
  FarcasterUserClaimTransactionDetails(
    input: FarcasterUserClaimTransactionInput!
  ): FarcasterUserClaimTransactionDetails!
}

input FarcasterUserClaimTransactionInput {
  fid: Int!
  transactionId: String
}

type FarcasterUserClaimTransactionDetails {
  transactionId: String
  transactionStatus: String
  transactionAmount: Float
  transactionAmountInWei: String
  rewardsLastEarnedTimestamp: String
}
