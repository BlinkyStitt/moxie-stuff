[package]
name = "moxie-stuff"
version = "0.1.0"
edition = "2021"

[dependencies]
# TODO: this must match the version in graphql_client. seems like it should re-export
reqwest = "0.11.27"
url = { version = "2.5.2", features = ["serde"] }

alloy = { version = "0.3.5", features = ["provider-anvil-api", "full", "node-bindings"] }
base64 = "0.22.1"
bigdecimal = { version = "0.4.5", features = ["serde"] }
chrono = "0.4.38"
dotenvy = "0.15.7"
envy = "0.4.2"
eyre = "0.6.12"
graphql_client = { version = "0.14.0", features = ["reqwest-rustls"] }
image = { version = "0.25.2", features = ["jpeg"], default-features = false }
math-parse = "1.0.2"
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
nz = "0.4.1"
petgraph = "0.6.5"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_path_to_error = "0.1.16"
tesseract = "0.15.1"
tokio = { version = "1.40.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
viuer = { version = "0.7.1" }
thiserror = "1.0.63"
